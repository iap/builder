[pytest]
testpaths = tests
python_files = test_*.py
# No filterwarnings here: an ini filter imports its warning category at
# config-parse time, so pytest cannot even collect tests where that module
# (starlette) is absent. The filter is registered in pyproject.toml
# ([tool.pytest.ini_options]) and applied by conftest.py at import time
# when starlette is importable.
