[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-plugin-builder"
version = "0.1.0"
description = "Amazon Q Developer (Builder ID) plugin for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "fastapi>=0.139",
    "uvicorn>=0.52",
    "openai>=1.0",
    "botocore>=1.42",
    "cryptography>=48.0.1",
    "ruff>=0.15",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "fastapi>=0.139",
    "uvicorn>=0.52",
    "openai>=1.0",
    "botocore>=1.42",
    "cryptography>=48.0.1",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ty]
src = ["."]
exclude = ["dashboard/dist", "__pycache__", ".venv"]

[tool.ruff]
exclude = [
    ".github",
    ".venv",
    "__pycache__",
    "dashboard/dist",
    "dist",
    "build",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "RUF059"]
"_format.py" = ["S110"]
"adapter.py" = ["BLE001", "S110", "S112", "PLW1510"]
"auth/sso_oidc.py" = ["S112"]
"backend.py" = ["BLE001", "S112"]
"tests/test_build.py" = ["BLE001"]
"verify.py" = ["RUF100"]

[tool.mise]
# tools are managed via mise's uv backend; see .mise.toml
