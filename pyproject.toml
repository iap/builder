[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-plugin-builder"
version = "0.1.0"
description = "Amazon Q Developer (Builder ID) plugin for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "fastapi>=0.139",
    "uvicorn>=0.52",
    "openai>=1.0",
    "botocore>=1.42",
    "cryptography>=48.0.1",
    "ruff>=0.15",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "fastapi>=0.139",
    "uvicorn>=0.52",
    "openai>=1.0",
    "botocore>=1.42",
    "cryptography>=48.0.1",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ty]
src = ["."]
exclude = ["dashboard/dist", "__pycache__", ".venv"]

[tool.ruff]
exclude = [
    ".github",
    ".venv",
    "__pycache__",
    "dashboard/dist",
    "dist",
    "build",
]

[tool.mise]
# tools are managed via mise's uv backend; see .mise.toml
